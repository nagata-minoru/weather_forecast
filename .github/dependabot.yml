# 依存パッケージの更新PRを週1回作る
# 公開から14日たっていない版は使わない（cooldown。通常の版更新だけで、セキュリティ更新には効かない）
# PRはセキュリティ更新も含めて、エコシステムごとに1つにまとめる
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
